[project]
name = "gpb-ai-clientappeals"
version = "0.1.0"
description = "ML pipeline for customer support tickets"
requires-python = ">=3.14"
dependencies = [

]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["pipeline", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- ty ---
[tool.ty.environment]
python-version = ">=3.14"

[tool.ty.src]
include = ["pipeline", "tests"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] # Позволяет писать `from pipeline.classifier import ...` в тестах
addopts = "-q --tb=short"
